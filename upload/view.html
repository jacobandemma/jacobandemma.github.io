<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Wedding photos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
<style>
  :root { --ink:#2f2a26; --muted:#8a8078; --line:#e6ded4; --bg:#faf7f2; --accent:#7d8b6a; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  header { position:sticky; top:0; z-index:2; background:rgba(250,247,242,.94); backdrop-filter:blur(8px); border-bottom:1px solid var(--line);
    padding:14px 20px; padding-top:calc(14px + env(safe-area-inset-top)); display:flex; flex-wrap:wrap; gap:12px; align-items:center; }
  h1 { font:500 1.8rem/1 "Cormorant Garamond", Georgia, serif; margin:0; flex:1; }
  .stats { color:var(--muted); }
  select, input, button { font:inherit; padding:8px 12px; border:1px solid var(--line); border-radius:8px; background:#fff; color:var(--ink); }
  button { cursor:pointer; }
  main { padding:20px; }
  h2 { font:500 1.4rem/1.2 "Cormorant Garamond", Georgia, serif; margin:28px 0 10px; }
  h2 small { font:400 .85rem -apple-system, sans-serif; color:var(--muted); margin-left:6px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(180px, 1fr)); gap:8px; }
  .grid a { aspect-ratio:1; display:block; border-radius:6px; overflow:hidden; background:var(--line); }
  .grid img { width:100%; height:100%; object-fit:cover; display:block; transition:transform .2s; }
  .grid a:hover img { transform:scale(1.03); }
  .empty, .gate { text-align:center; color:var(--muted); padding:80px 20px; }
  .gate form { display:flex; gap:8px; justify-content:center; margin-top:12px; flex-wrap:wrap; }
  .lb { position:fixed; inset:0; z-index:5; background:rgba(20,18,16,.94); display:flex; flex-direction:column; }
  .lb .img { flex:1; min-height:0; display:grid; place-items:center; padding:12px; }
  .lb img { max-width:100%; max-height:100%; object-fit:contain; }
  .lb .bar { display:flex; gap:10px; align-items:center; padding:12px 16px calc(12px + env(safe-area-inset-bottom)); color:#eee; }
  .lb .bar .who { flex:1; }
  .lb .bar a, .lb .bar button { color:#eee; background:rgba(255,255,255,.12); border:0; border-radius:8px; padding:8px 14px; text-decoration:none; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<header>
  <h1>Wedding photos</h1>
  <span class="stats" id="stats"></span>
  <select id="filter"><option value="">Everyone</option></select>
  <button id="refresh">Refresh</button>
</header>
<main id="main"></main>

<div class="lb" id="lb" hidden>
  <div class="img"><img id="lbImg" alt=""></div>
  <div class="bar">
    <button id="prev" aria-label="Previous">‹</button>
    <button id="next" aria-label="Next">›</button>
    <span class="who" id="lbWho"></span>
    <a id="lbDl" href="#">Download</a>
    <button id="close">Close</button>
  </div>
</div>

<script>
const params = new URLSearchParams(location.search);
const WORKER_URL = params.get("api") || "https://wedding-photos.jacobwestra0.workers.dev";
let key = params.get("key") || (() => { try { return localStorage.getItem("viewKey"); } catch {} })() || "";
let photos = [], shown = [], current = -1;

const $ = (id) => document.getElementById(id);
const src = (p, dl) => `${WORKER_URL}/photo/${p.id}?key=${encodeURIComponent(key)}${dl ? "&dl=1" : ""}`;
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

async function load() {
  if (!key) return gate();
  $("main").innerHTML = `<p class="empty">Loading…</p>`;
  const res = await fetch(`${WORKER_URL}/photos?key=${encodeURIComponent(key)}`);
  if (res.status === 401) { key = ""; return gate("That key didn't work."); }
  if (!res.ok) { $("main").innerHTML = `<p class="empty">Couldn't load photos (${res.status}).</p>`; return; }
  try { localStorage.setItem("viewKey", key); } catch {}
  photos = (await res.json()).photos;
  const names = [...new Set(photos.map((p) => p.name))].sort((a, b) => a.localeCompare(b));
  const sel = $("filter"), prev = sel.value;
  sel.innerHTML = `<option value="">Everyone (${names.length})</option>` +
    names.map((n) => `<option value="${esc(n)}">${esc(n)} (${photos.filter((p) => p.name === n).length})</option>`).join("");
  sel.value = names.includes(prev) ? prev : "";
  render();
}

function render() {
  const who = $("filter").value;
  const list = who ? photos.filter((p) => p.name === who) : photos;
  $("stats").textContent = `${photos.length} photos · ${new Set(photos.map((p) => p.name)).size} guests`;
  if (!list.length) { $("main").innerHTML = `<p class="empty">No photos yet.</p>`; shown = []; return; }
  // Group by guest, newest upload first within each group, guests by most recent upload.
  const groups = new Map();
  for (const p of list) (groups.get(p.name) || groups.set(p.name, []).get(p.name)).push(p);
  shown = [...groups.values()].flat();
  let i = 0;
  $("main").innerHTML = [...groups].map(([name, ps]) =>
    `<h2>${esc(name)}<small>${ps.length} photo${ps.length === 1 ? "" : "s"}</small></h2><div class="grid">` +
    ps.map((p) => `<a href="${src(p)}" data-i="${i++}"><img loading="lazy" src="${src(p)}" alt=""></a>`).join("") + `</div>`
  ).join("");
}

function gate(note = "") {
  $("main").innerHTML = `<div class="gate">${note ? `<p>${note}</p>` : ""}<p>Enter the viewing key.</p>
    <form id="gateForm"><input id="keyIn" type="password" placeholder="Key" autofocus><button>View photos</button></form></div>`;
  $("gateForm").onsubmit = (e) => { e.preventDefault(); key = $("keyIn").value.trim(); load(); };
}

function open(i) {
  current = (i + shown.length) % shown.length;
  const p = shown[current];
  $("lbImg").src = src(p);
  $("lbWho").textContent = `${p.name} · ${new Date(p.createdAt).toLocaleString()} · ${current + 1}/${shown.length}`;
  $("lbDl").href = src(p, true);
  $("lb").hidden = false;
}
const close = () => { $("lb").hidden = true; current = -1; };

$("main").addEventListener("click", (e) => {
  const a = e.target.closest("a[data-i]");
  if (a) { e.preventDefault(); open(+a.dataset.i); }
});
$("prev").onclick = () => open(current - 1);
$("next").onclick = () => open(current + 1);
$("close").onclick = close;
$("lb").addEventListener("click", (e) => { if (e.target.classList.contains("img")) close(); });
document.addEventListener("keydown", (e) => {
  if (current < 0) return;
  if (e.key === "Escape") close();
  if (e.key === "ArrowLeft") open(current - 1);
  if (e.key === "ArrowRight") open(current + 1);
});
$("filter").onchange = render;
$("refresh").onclick = load;
load();
</script>
</body>
</html>
